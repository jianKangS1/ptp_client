# linuxptp ptp4l — WSL 二层从时钟（ITU-T G.8275.1，domain 43，E2E）
# 文档: https://linuxptp.nwtime.org/documentation/configs/g82751/
#
# 对端 = 本仓库软件 Master（ptp_client.ptp.l2master）
#   配置: config/ptp-l2-master.json   设计: docs/g82751-l2-e2e-master-design.md
#   - 二层 L2 传输（EtherType 0x88F7），无 IP
#   - 延迟机制 E2E：本端发 Delay_Req，Master 回 Delay_Resp
#     ⚠ 不要用 P2P：P2P 会发 Pdelay_Req，当前 Master 未实现
#   - 组播发现，无需指定 Master 的 IP / MAC
#
# ⚠ 网卡必须是 eth3：WSL 处于 mirrored 模式（.wslconfig networkingMode=mirrored），
#   eth3 即宿主 WLAN 的镜像；eth0/eth1/eth2 全部 DOWN，绑上去收不到任何报文。
#   查看：ip -br link
#
# 启动（安静：只打印状态变化与每秒同步偏移，不打印逐包）：
#   sudo ptp4l -i eth3 -f ./ptp4l-unicast-client.conf -m
# 更安静（只关心是否锁定，不看每秒一行）：
#   sudo ptp4l -i eth3 -f ./ptp4l-unicast-client.conf -m -l 5
# 完全静默（日志只进 syslog，前台无输出）：
#   sudo ptp4l -i eth3 -f ./ptp4l-unicast-client.conf -q
#   之后查看：grep ptp4l /var/log/syslog | tail -20
#
# 逐包日志交给 tcpdump/Wireshark 看，不要靠 logging_level 7（见 README 抓包说明）
#
# 判读日志：
#   "selected foreign master ... as best master" = 已收到 Master 的 Announce（正常）
#   "selected local clock ... as best master"    = 没收到任何 Announce（L2 链路不通）
#   正常后续：LISTENING → UNCALIBRATED → SLAVE，并开始发 Delay_Req

[global]
domainNumber 43
slaveOnly 1
network_transport L2
delay_mechanism E2E
time_stamping software

# —— L2 组播地址 ——
# linuxptp 在 L2 下默认监听 01:1B:19:00:00:00（见 syslog 中 eth3.ptp_dst_mac）。
# 软件 Master 的 config/ptp-l2-master.json 必须与此一致，否则本端 socket 直接过滤掉。
# 若要按 G.8275.1 用桥驻留地址，改为 01:80:C2:00:00:0E 并同步修改 Master 的 dstMac。
ptp_dst_mac 01:1B:19:00:00:00

# —— 与 Master 保持一致的消息间隔（2^n 秒）——
logAnnounceInterval -3
logSyncInterval -4
logMinDelayReqInterval -4
announceReceiptTimeout 3

# —— G.8275.1 数据集比较与优先级 ——
dataset_comparison G.8275.x
G.8275.defaultDS.localPriority 128
G.8275.portDS.localPriority 128
maxStepsRemoved 255
priority1 128
priority2 128
# slaveOnly 下本端不宣告，以下三项仅作占位
clockClass 248
clockAccuracy 0xFE
offsetScaledLogVariance 0xFFFF

# 日志级别：6=INFO（只输出状态变化与每秒同步结果，推荐）
#           7=DEBUG（逐条打印每个收发报文，仅在 tcpdump 不可用时临时排查）
logging_level 6

[eth3]
