# linuxptp ptp4l — 单播 Grandmaster（实验室：供单播客户端 / 本仓库 Python 客户端联调）
# 官方说明: https://linuxptp.nwtime.org/documentation/configs/unicast-master/
#
# 使用前：
#   1) 将最后一节 [eth0] 改为 WSL 真实网卡名（与下面启动命令 -i 一致）：ip -br link
#   2) domainNumber 与客户端一致（G.8275.2 常用 44；普通域可用 0）
#
# 启动（在 scripts/wsl 目录）：
#   sudo ptp4l -i eth0 -f ./ptp4l-unicast-master.conf -m
#
# 与仓库 Python「g8275-negotiate」对联调时，需启用 ITU-T G.8275.2 侧参数（见 linuxptp configs/G.8275.2.cfg）。
# 改配置后请重启 ptp4l。

[global]
domainNumber 44
twoStepFlag 1
# 必须 0：允许担任 Grandmaster（从时钟配置里是 slaveOnly 1）
slaveOnly 0
# serverOnly：仅较新 linuxptp 支持；旧版会因 unknown option 拒绝解析，故不写。GM 场景默认与 serverOnly 0 等价。
# WSL 上无外部 PRTC/phc2sys 时，本地时钟作为时间源，不向“上游 PTP 主”驯服
free_running 1
priority1 128
priority2 128
clockClass 248
logging_level 6

# —— G.8275.2（linuxptp G.8275.2.cfg）——
dataset_comparison G.8275.x
G.8275.defaultDS.localPriority 128
G.8275.portDS.localPriority 128
maxStepsRemoved 255
logAnnounceInterval 0
unicast_req_duration 300

# 单播主时钟：不发组播业务，监听单播请求（与 unicast-slave / 单播客户端对端）
hybrid_e2e 1
inhibit_multicast_service 1
unicast_listen 1

network_transport UDPv4
delay_mechanism E2E
time_stamping software

[eth0]
